<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>渐变几何图形 Hover 效果</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body{
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #1d1b1a;
            font-family: Arial, "Microsoft YaHei", sans-serif;
        }
        .stage{
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 56px;
            padding: 56px 32px;
        }
        .cube{
            position: relative;
            width: 170px;
            height: 170px;
            transition: transform .3s ease, box-shadow .3s ease;
        }
        /* 悬停：整体上移 10px */
        .cube:hover{
            transform: translateY(-10px);
        }
        /* 悬停：形状中央出现 "hover" 字样 */
        .cube::after{
            content: "hover";
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #fff;
            font-size: 24px;
            font-weight: 700;
            letter-spacing: 3px;
            text-shadow: 0 1px 6px rgba(0, 0, 0, .35);
            opacity: 0;
            transition: opacity .3s ease;
            pointer-events: none;
        }
        .cube:hover::after{
            opacity: 1;
        }

        /* 1. 橙色渐变方形 */
        .c1{
            border-radius: 8px;
            background: linear-gradient(135deg, #ff9a56, #ff5e62);
            box-shadow: 0 10px 24px rgba(255, 94, 98, .35);
        }
        .c1:hover{
            box-shadow: 0 0 24px rgba(255, 94, 98, .35);
        }

        /* 2. 青绿色渐变方形 */
        .c2{
            border-radius: 14px;
            background: linear-gradient(135deg, #36d29c, #39cf8b);
            box-shadow: 0 10px 24px rgba(57, 207, 140, .35);
        }
        .c2:hover{
            box-shadow: 0 0 24px rgba(57, 207, 140, .35);
        }

        /* 3. 浅紫渐变圆角方形 */
        .c3{
            border-radius: 36px;
            background: linear-gradient(180deg, #ac86a4, #686292);
            box-shadow: 0 10px 24px rgba(139, 115, 155, .35);
        }
        .c3:hover{
            box-shadow: 0 0 24px rgba(139, 115, 155, .35);
        }

        /* 4. 暖黄渐变圆形 */
        .c4{
            border-radius: 50%;
            background: radial-gradient(circle at center, #f9c36e, #fab776);
            box-shadow: 0 10px 24px rgba(249, 194, 111, .35);
        }
        .c4:hover{
            box-shadow: 0 0 24px rgba(249, 194, 111, .35);
        }

        /* 5. 深青绿渐变方形 */
        .c5{
            border-radius: 8px;
            background: linear-gradient(135deg, #47825d, #4e6988);
            box-shadow: 0 10px 24px rgba(74, 117, 114, .35);
        }
        .c5:hover{
            box-shadow: 0 0 24px rgba(74, 117, 114, .35);
        }

        /* 6. 淡紫渐变圆形 */
        .c6{
            border-radius: 50%;
            background: radial-gradient(circle at center, #ac8bb3, #8c739a);
            box-shadow: 0 10px 24px rgba(172, 139, 179, .35);
        }
        .c6:hover{
            box-shadow: 0 0 24px rgba(172, 139, 179, .35);
        }
    </style>
</head>
<body>
    <div class="stage">
        <div class="cube c1"></div>
        <div class="cube c2"></div>
        <div class="cube c3"></div>
        <div class="cube c4"></div>
        <div class="cube c5"></div>
        <div class="cube c6"></div>
    </div>
</body>
</html>
