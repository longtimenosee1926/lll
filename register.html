<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>用户注册 - AI助教答疑平台</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      min-height: 100vh;
      background: linear-gradient(135deg, #eef2ff 0%, #f8fafc 50%, #f0f9ff 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      color: #1e293b;
    }
    .register-card {
      width: 100%;
      max-width: 480px;
      background: #ffffff;
      border-radius: 20px;
      box-shadow: 0 20px 60px -15px rgba(37, 99, 235, 0.15), 0 4px 12px rgba(0,0,0,0.04);
      padding: 40px 36px;
    }
    .brand { text-align: center; margin-bottom: 28px; }
    .brand h1 { font-size: 22px; font-weight: 700; color: #0f172a; letter-spacing: 0.5px; }
    .brand p { font-size: 13px; color: #94a3b8; margin-top: 6px; }
    .form-group { margin-bottom: 18px; }
    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #334155;
      margin-bottom: 6px;
    }
    .form-group label .req { color: #ef4444; margin-left: 2px; }
    .form-group input,
    .form-group select {
      width: 100%;
      padding: 11px 14px;
      border: 1.5px solid #e2e8f0;
      border-radius: 10px;
      font-size: 14px;
      background: #f8fafc;
      transition: all 0.2s ease;
      outline: none;
      color: #1e293b;
    }
    .form-group input:focus,
    .form-group select:focus {
      border-color: #2563eb;
      background: #fff;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
    }
    .form-group input:invalid:not(:placeholder-shown) {
      border-color: #ef4444;
    }
    .form-group input:valid:not(:placeholder-shown) {
      border-color: #22c55e;
    }
    .row { display: flex; gap: 12px; }
    .row .form-group { flex: 1; }
    .hint { font-size: 12px; color: #94a3b8; margin-top: 4px; }
    .error-msg { font-size: 12px; color: #ef4444; margin-top: 4px; display: none; }
    .form-group input:invalid:not(:placeholder-shown) ~ .error-msg { display: block; }

    /* 密码强度条 - 使用 HTML5 meter */
    .strength-wrap { margin-top: 6px; display: flex; align-items: center; gap: 8px; }
    meter {
      flex: 1;
      height: 8px;
      border-radius: 4px;
      overflow: hidden;
    }
    meter::-webkit-meter-optimum-value { background: #22c55e; }
    meter::-webkit-meter-suboptimum-value { background: #f59e0b; }
    meter::-webkit-meter-even-less-good-value { background: #ef4444; }
    #strengthText { font-size: 12px; color: #64748b; min-width: 36px; }

    /* 确认密码匹配提示 - output 元素 */
    #confirmMsg { font-size: 12px; margin-top: 4px; display: block; }
    #confirmMsg.ok { color: #22c55e; }
    #confirmMsg.fail { color: #ef4444; }

    /* 头像上传 */
    .avatar-upload {
      display: flex; align-items: center; gap: 12px;
      padding: 12px; border: 1.5px dashed #cbd5e1; border-radius: 10px;
      background: #f8fafc; cursor: pointer; transition: all .2s;
    }
    .avatar-upload:hover { border-color: #2563eb; background: #eff6ff; }
    .avatar-preview {
      width: 48px; height: 48px; border-radius: 50%;
      background: #e2e8f0; display: flex; align-items: center; justify-content: center;
      font-size: 20px; color: #94a3b8; overflow: hidden; flex-shrink: 0;
    }
    .avatar-preview img { width: 100%; height: 100%; object-fit: cover; }
    .avatar-upload span { font-size: 13px; color: #64748b; }
    input[type="file"] { display: none; }

    /* 单选框组 */
    .radio-group { display: flex; gap: 16px; padding-top: 4px; }
    .radio-group label {
      display: flex; align-items: center; gap: 6px;
      font-weight: 400; cursor: pointer; font-size: 14px;
    }
    .radio-group input[type="radio"] { width: 16px; height: 16px; accent-color: #2563eb; }

    /* 协议勾选 */
    .agreement { display: flex; align-items: flex-start; gap: 8px; margin: 18px 0; }
    .agreement input { width: 16px; height: 16px; margin-top: 2px; accent-color: #2563eb; flex-shrink: 0; }
    .agreement span { font-size: 13px; color: #64748b; line-height: 1.5; }
    .agreement a { color: #2563eb; text-decoration: none; }
    .agreement a:hover { text-decoration: underline; }

    .btn-submit {
      width: 100%;
      padding: 13px;
      background: linear-gradient(135deg, #2563eb, #3b82f6);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      letter-spacing: 1px;
    }
    .btn-submit:hover { transform: translateY(-1px); box-shadow: 0 8px 20px rgba(37,99,235,0.35); }
    .btn-submit:active { transform: translateY(0); }

    .login-link { text-align: center; margin-top: 18px; font-size: 13px; color: #64748b; }
    .login-link a { color: #2563eb; text-decoration: none; font-weight: 600; }
    .login-link a:hover { text-decoration: underline; }

    /* 密码可见性切换 */
    .pwd-wrap { position: relative; }
    .pwd-wrap input { padding-right: 40px; }
    .toggle-pwd {
      position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
      cursor: pointer; color: #94a3b8; font-size: 16px; user-select: none;
      background: none; border: none;
    }
  </style>
</head>
<body>
  <div class="register-card">
    <div class="brand">
      <h1>AI助教答疑平台</h1>
      <p>创建账号 · 开启智能学习之旅</p>
    </div>

    <!-- novalidate 关闭浏览器默认气泡，使用自定义验证提示 -->
    <form id="registerForm" novalidate autocomplete="on" action="#" method="post">

      <!-- 头像上传：accept 限制图片类型 -->
      <div class="form-group">
        <label>头像</label>
        <label class="avatar-upload" for="avatar">
          <div class="avatar-preview" id="avatarPreview">👤</div>
          <span>点击上传头像（仅支持 JPG/PNG）</span>
        </label>
        <input type="file" id="avatar" name="avatar" accept="image/png, image/jpeg, image/gif" />
      </div>

      <!-- 用户名：required + minlength + maxlength + pattern + autofocus -->
      <div class="form-group">
        <label for="username">用户名<span class="req">*</span></label>
        <input type="text" id="username" name="username"
               placeholder="3-20位字母、数字或下划线"
               required minlength="3" maxlength="20" pattern="[A-Za-z0-9_]+"
               autofocus autocomplete="username" enterkeyhint="next" />
        <p class="error-msg">用户名需为 3-20 位字母、数字或下划线</p>
      </div>

      <!-- 邮箱：type=email -->
      <div class="form-group">
        <label for="email">邮箱<span class="req">*</span></label>
        <input type="email" id="email" name="email"
               placeholder="example@school.edu.cn"
               required autocomplete="email" inputmode="email" />
        <p class="error-msg">请输入有效的邮箱地址</p>
      </div>

      <div class="row">
        <!-- 手机号：type=tel + pattern -->
        <div class="form-group">
          <label for="phone">手机号<span class="req">*</span></label>
          <input type="tel" id="phone" name="phone"
                 placeholder="11位手机号"
                 required pattern="^1[3-9]\d{9}$"
                 autocomplete="tel" inputmode="numeric" />
          <p class="error-msg">请输入有效的11位手机号</p>
        </div>

        <!-- 学号 -->
        <div class="form-group">
          <label for="sid">学号<span class="req">*</span></label>
          <input type="text" id="sid" name="sid"
                 placeholder="如 2024001"
                 required pattern="^\d{6,12}$"
                 inputmode="numeric" />
          <p class="error-msg">学号为 6-12 位数字</p>
        </div>
      </div>

      <!-- 学院：datalist 提供自动补全建议 -->
      <div class="form-group">
        <label for="college">所属学院</label>
        <input type="text" id="college" name="college"
               placeholder="选择或输入你的学院"
               list="collegeList" autocomplete="organization" />
        <datalist id="collegeList">
          <option value="计算机科学与技术学院"></option>
          <option value="软件学院"></option>
          <option value="电子信息学院"></option>
          <option value="数学与统计学院"></option>
          <option value="外国语学院"></option>
          <option value="经济管理学院"></option>
        </datalist>
      </div>

      <div class="row">
        <!-- 出生日期：type=date -->
        <div class="form-group">
          <label for="birthday">出生日期</label>
          <input type="date" id="birthday" name="birthday"
                 min="2000-01-01" max="2008-12-31" />
        </div>

        <!-- 性别：radio -->
        <div class="form-group">
          <label>性别</label>
          <div class="radio-group">
            <label><input type="radio" name="gender" value="male" checked />男</label>
            <label><input type="radio" name="gender" value="female" />女</label>
            <label><input type="radio" name="gender" value="other" />保密</label>
          </div>
        </div>
      </div>

      <!-- 密码：type=password + minlength + meter 强度条 -->
      <div class="form-group">
        <label for="password">密码<span class="req">*</span></label>
        <div class="pwd-wrap">
          <input type="password" id="password" name="password"
                 placeholder="至少8位，含字母和数字"
                 required minlength="8" autocomplete="new-password" />
          <button type="button" class="toggle-pwd" onclick="togglePwd('password', this)">👁</button>
        </div>
        <div class="strength-wrap">
          <meter id="strength" min="0" max="4" low="2" high="3" optimum="4" value="0"></meter>
          <span id="strengthText">未输入</span>
        </div>
      </div>

      <!-- 确认密码：output 元素实时反馈 -->
      <div class="form-group">
        <label for="confirm">确认密码<span class="req">*</span></label>
        <div class="pwd-wrap">
          <input type="password" id="confirm" name="confirm"
                 placeholder="再次输入密码"
                 required minlength="8" autocomplete="new-password" />
          <button type="button" class="toggle-pwd" onclick="togglePwd('confirm', this)">👁</button>
        </div>
        <output id="confirmMsg" for="password confirm"></output>
      </div>

      <!-- 协议：required checkbox -->
      <div class="agreement">
        <input type="checkbox" id="agree" name="agree" required />
        <span>我已阅读并同意 <a href="#" target="_blank">《用户服务协议》</a> 和 <a href="#" target="_blank">《隐私政策》</a></span>
      </div>

      <button type="submit" class="btn-submit">注 册</button>
    </form>

    <div class="login-link">
      已有账号？<a href="login.html">立即登录</a>
    </div>
  </div>

  <script>
    // 头像预览
    document.getElementById('avatar').addEventListener('change', function (e) {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = ev => {
          document.getElementById('avatarPreview').innerHTML =
            '<img src="' + ev.target.result + '" alt="头像预览" />';
        };
        reader.readAsDataURL(file);
      }
    });

    // 密码可见性切换
    function togglePwd(id, btn) {
      const input = document.getElementById(id);
      input.type = input.type === 'password' ? 'text' : 'password';
      btn.textContent = input.type === 'password' ? '👁' : '🙈';
    }

    // 密码强度检测（结合 meter 元素）
    const pwd = document.getElementById('password');
    const strength = document.getElementById('strength');
    const strengthText = document.getElementById('strengthText');
    pwd.addEventListener('input', function () {
      const v = this.value;
      let score = 0;
      if (v.length >= 8) score++;
      if (/[A-Z]/.test(v) && /[a-z]/.test(v)) score++;
      if (/\d/.test(v)) score++;
      if (/[^A-Za-z0-9]/.test(v)) score++;
      strength.value = score;
      const labels = ['未输入', '弱', '一般', '较强', '很强'];
      strengthText.textContent = v ? labels[score] : '未输入';
    });

    // 确认密码实时匹配反馈（output 元素）
    const confirm = document.getElementById('confirm');
    const confirmMsg = document.getElementById('confirmMsg');
    confirm.addEventListener('input', function () {
      if (!this.value) { confirmMsg.textContent = ''; return; }
      if (this.value === pwd.value) {
        confirmMsg.textContent = '✓ 两次密码输入一致';
        confirmMsg.className = 'ok';
      } else {
        confirmMsg.textContent = '✗ 两次密码不一致';
        confirmMsg.className = 'fail';
      }
    });

    // 表单提交：自定义验证提示
    document.getElementById('registerForm').addEventListener('submit', function (e) {
      e.preventDefault();
      if (!this.checkValidity()) {
        this.reportValidity();
        return;
      }
      if (pwd.value !== confirm.value) {
        alert('两次输入的密码不一致！');
        return;
      }
      if (!document.getElementById('agree').checked) {
        alert('请先同意用户协议！');
        return;
      }
      alert('注册成功！即将跳转到登录页...');
      location.href = 'login.html';
    });
  </script>
</body>
</html>
