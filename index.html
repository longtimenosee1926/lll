<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI助教答疑平台</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      min-height: 100vh;
      background: linear-gradient(135deg, #eef2ff 0%, #f8fafc 50%, #f0f9ff 100%);
      display: flex; align-items: center; justify-content: center;
      padding: 24px; color: #1e293b;
    }
    .container { width: 100%; max-width: 560px; }

    /* 顶部导航 */
    .topbar {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 32px;
    }
    .topbar .user-area { display: flex; gap: 12px; align-items: center; }
    .topbar a {
      font-size: 13px; color: #64748b; text-decoration: none;
      padding: 6px 14px; border-radius: 8px; transition: all .2s;
    }
    .topbar a:hover { background: #e2e8f0; color: #2563eb; }
    .topbar a.primary {
      background: #2563eb; color: #fff;
    }
    .topbar a.primary:hover { background: #1d4ed8; }

    /* 标题区 */
    .header { text-align: center; margin-bottom: 32px; }
    .header h1 { font-size: 26px; font-weight: 700; color: #0f172a; letter-spacing: 1px; }
    .header p { font-size: 13px; color: #94a3b8; margin-top: 6px; }

    /* 提问输入区 */
    .ask-box {
      background: #f1f5f9; border-radius: 14px; padding: 8px;
      display: flex; gap: 8px; align-items: center;
      box-shadow: inset 0 2px 6px rgba(0,0,0,0.04);
    }
    .ask-box input {
      flex: 1; border: none; background: transparent; outline: none;
      padding: 10px 12px; font-size: 15px; color: #1e293b;
    }
    .ask-box input::placeholder { color: #94a3b8; }
    .ask-box button {
      background: #2563eb; color: #fff; border: none;
      padding: 10px 24px; border-radius: 10px; font-size: 14px;
      cursor: pointer; transition: all .2s; font-weight: 500;
    }
    .ask-box button:hover { background: #1d4ed8; }

    /* 对话记录区 */
    .chat-area { margin-top: 24px; display: flex; flex-direction: column; gap: 12px; }
    .msg {
      background: #f1f5f9; border-radius: 14px; padding: 14px 18px;
      font-size: 14px; color: #475569; line-height: 1.6;
    }
    .msg .tag {
      display: inline-block; background: #dbeafe; color: #2563eb;
      font-size: 11px; padding: 2px 8px; border-radius: 6px;
      margin-bottom: 6px; font-weight: 500;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="topbar">
      <div style="font-weight:700; color:#2563eb; font-size:16px;">🎓 AI助教</div>
      <div class="user-area">
        <a href="login.html">登录</a>
        <a href="register.html" class="primary">注册</a>
      </div>
    </div>

    <div class="header">
      <h1>AI助教答疑平台</h1>
      <p>智能答疑 · 随时提问</p>
    </div>

    <!-- 提问表单 -->
    <form class="ask-box" id="askForm">
      <input type="text" id="question" placeholder="1"
             required autocomplete="off" enterkeyhint="send" />
      <button type="submit">提问</button>
    </form>

    <!-- 对话记录 -->
    <div class="chat-area" id="chatArea">
      <div class="msg">
        <span class="tag">AI助教</span>
        <div>这是第1个问题，AI接口将在第9周接入</div>
      </div>
    </div>
  </div>

  <script>
    let count = 1;
    document.getElementById('askForm').addEventListener('submit', function (e) {
      e.preventDefault();
      const q = document.getElementById('question').value.trim();
      if (!q) return;
      count++;
      const area = document.getElementById('chatArea');
      const div = document.createElement('div');
      div.className = 'msg';
      div.innerHTML = '<span class="tag">AI助教</span><div>这是第' + count + '个问题，AI接口将在第9周接入</div>';
      area.appendChild(div);
      document.getElementById('question').value = '';
    });
  </script>
</body>
</html>
