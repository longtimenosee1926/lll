<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>用户登录 - AI助教答疑平台</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      min-height: 100vh;
      background: linear-gradient(135deg, #eef2ff 0%, #f8fafc 50%, #f0f9ff 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      color: #1e293b;
    }
    .login-card {
      width: 100%;
      max-width: 420px;
      background: #ffffff;
      border-radius: 20px;
      box-shadow: 0 20px 60px -15px rgba(37, 99, 235, 0.15), 0 4px 12px rgba(0,0,0,0.04);
      padding: 44px 36px;
    }
    .brand { text-align: center; margin-bottom: 32px; }
    .brand .logo {
      width: 56px; height: 56px; margin: 0 auto 14px;
      background: linear-gradient(135deg, #2563eb, #3b82f6);
      border-radius: 16px;
      display: flex; align-items: center; justify-content: center;
      font-size: 28px;
      box-shadow: 0 8px 20px rgba(37,99,235,0.3);
    }
    .brand h1 { font-size: 22px; font-weight: 700; color: #0f172a; }
    .brand p { font-size: 13px; color: #94a3b8; margin-top: 6px; }

    .form-group { margin-bottom: 20px; }
    .form-group label {
      display: block; font-size: 13px; font-weight: 600;
      color: #334155; margin-bottom: 6px;
    }
    .input-wrap { position: relative; }
    .input-wrap .icon {
      position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
      color: #94a3b8; font-size: 16px;
    }
    .form-group input {
      width: 100%; padding: 12px 14px 12px 42px;
      border: 1.5px solid #e2e8f0; border-radius: 10px;
      font-size: 14px; background: #f8fafc; outline: none;
      transition: all 0.2s ease; color: #1e293b;
    }
    .form-group input:focus {
      border-color: #2563eb; background: #fff;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
    }
    .form-group input:invalid:not(:placeholder-shown) { border-color: #ef4444; }

    .toggle-pwd {
      position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
      cursor: pointer; color: #94a3b8; font-size: 16px;
      background: none; border: none;
    }

    .options {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 24px; font-size: 13px;
    }
    .options label { display: flex; align-items: center; gap: 6px; color: #64748b; cursor: pointer; }
    .options input[type="checkbox"] { width: 15px; height: 15px; accent-color: #2563eb; }
    .options a { color: #2563eb; text-decoration: none; }
    .options a:hover { text-decoration: underline; }

    .btn-login {
      width: 100%; padding: 13px;
      background: linear-gradient(135deg, #2563eb, #3b82f6);
      color: #fff; border: none; border-radius: 10px;
      font-size: 15px; font-weight: 600; cursor: pointer;
      transition: all 0.2s; letter-spacing: 4px;
    }
    .btn-login:hover { transform: translateY(-1px); box-shadow: 0 8px 20px rgba(37,99,235,0.35); }

    .divider {
      display: flex; align-items: center; margin: 24px 0;
      color: #cbd5e1; font-size: 12px;
    }
    .divider::before, .divider::after {
      content: ''; flex: 1; height: 1px; background: #e2e8f0;
    }
    .divider span { padding: 0 12px; }

    .register-link { text-align: center; font-size: 13px; color: #64748b; }
    .register-link a { color: #2563eb; text-decoration: none; font-weight: 600; }
    .register-link a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="brand">
      <div class="logo">🎓</div>
      <h1>AI助教答疑平台</h1>
      <p>智能答疑 · 随时提问</p>
    </div>

    <!-- autocomplete=on 让浏览器记住账号 -->
    <form id="loginForm" novalidate autocomplete="on" action="#" method="post">

      <!-- 账号：type=text / email 通用，required + autofocus + autocomplete -->
      <div class="form-group">
        <label for="account">账号</label>
        <div class="input-wrap">
          <span class="icon">👤</span>
          <input type="text" id="account" name="account"
                 placeholder="用户名 / 邮箱 / 手机号"
                 required autofocus autocomplete="username"
                 enterkeyhint="next" />
        </div>
      </div>

      <!-- 密码：type=password + required -->
      <div class="form-group">
        <label for="password">密码</label>
        <div class="input-wrap">
          <span class="icon">🔒</span>
          <input type="password" id="password" name="password"
                 placeholder="请输入密码"
                 required autocomplete="current-password"
                 enterkeyhint="go" />
          <button type="button" class="toggle-pwd" onclick="togglePwd()">👁</button>
        </div>
      </div>

      <div class="options">
        <!-- 记住我：checkbox -->
        <label><input type="checkbox" id="remember" name="remember" /> 记住我</label>
        <a href="#">忘记密码？</a>
      </div>

      <button type="submit" class="btn-login">登 录</button>
    </form>

    <div class="divider"><span>还没有账号</span></div>

    <div class="register-link">
      立即注册 → <a href="register.html">创建新账号</a>
    </div>
  </div>

  <script>
    function togglePwd() {
      const input = document.getElementById('password');
      input.type = input.type === 'password' ? 'text' : 'password';
      event.target.textContent = input.type === 'password' ? '👁' : '🙈';
    }

    document.getElementById('loginForm').addEventListener('submit', function (e) {
      e.preventDefault();
      const account = document.getElementById('account').value.trim();
      const pwd = document.getElementById('password').value;
      if (!account) { alert('请输入账号！'); return; }
      if (!pwd) { alert('请输入密码！'); return; }
      alert('登录成功！欢迎回来，' + account);
      location.href = 'index.html';
    });
  </script>
</body>
</html>
